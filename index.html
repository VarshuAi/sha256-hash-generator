<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHA-256 Hash Generator — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">🛡</span>
                <div class="title-col">
                    <h1>SHA-256 Hash Generator</h1>
                    <p class="tagline">Instant secure SHA-256 hash generator with visual comparative bounds.</p>
                </div>
            </div>
            <div class="badge">security</div>
        </header>

        <main class="workspace-card">
            
            <div class="input-group">
                <label>Message String</label>
                <textarea id="sha-input" placeholder="Type text to generate SHA-256 hash..."></textarea>
            </div>
            <div class="input-group" style="margin-top: 16px;">
                <label>SHA-256 Output Digest</label>
                <input type="text" id="sha-output" readonly style="font-family: monospace; font-size: 13px;">
            </div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
